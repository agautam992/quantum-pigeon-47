<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Memoir — Coming Soon</title>
<meta name="description" content="Soul Memoir is coming soon.">
<style>
  :root { --bg:#faf7f2; --fg:#2b2a33; --muted:#6b6878; --accent:#7a5cff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14131a; --fg:#f1eef8; --muted:#a29fb3; --accent:#a58bff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 0 16px;
  }
  h1 { font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 400; margin: 0 0 .5rem; letter-spacing: .02em; }
  .tag { display: inline-block; color: var(--accent); text-transform: uppercase; letter-spacing: .3em; font: 600 .8rem system-ui, sans-serif; margin-bottom: 1.5rem; }
  p { color: var(--muted); font-size: 1.15rem; margin: 0; }
</style>
</head>
<body>
  <main>
    <span class="tag">Coming Soon</span>
    <h1>Soul Memoir</h1>
    <p>Something meaningful is on its way. Please check back soon.</p>
  </main>
</body>
</html>
